<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMCA 관람 기록</title>
<meta name="robots" content="noindex">
<style>
:root {
  --bg: #1e1e1e; --cell: #1e1e1e; --cell-alt: #222222; --grid: #3a3a3a; --head: #2b2b2b; --head-ink: #bdbdbd;
  --ink: #e6e6e6; --muted: #9a9a9a; --bar: #262626; --title: #185c37; --accent: #21a366; --accent-dim: rgba(33,163,102,.18);
  --sel-row: rgba(33,163,102,.10); --input: #333333; --warn: #f08a5d; --visitor: #8fb8ff; --docent: #e6e6e6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; overflow: hidden;
  font: 13px/1.35 "Segoe UI", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
button, input, select { font: inherit; color: var(--ink); }

/* 제목 줄 */
.titlebar { background: var(--title); color: #fff; padding: 6px 12px; display: flex; align-items: center; gap: 10px; flex: none; }
.titlebar b { font-weight: 600; }
.titlebar .sp { flex: 1; }
.titlebar button { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; padding: 2px 10px; border-radius: 3px; cursor: pointer; }

/* 도구 줄 */
.toolbar { background: var(--bar); border-bottom: 1px solid var(--grid); padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; flex: none; }
.group { display: flex; align-items: center; gap: 6px; padding-right: 14px; border-right: 1px solid var(--grid); }
.group:last-child { border-right: 0; }
.group label { color: var(--muted); }
.toolbar input[type=date], .toolbar select { background: var(--input); border: 1px solid var(--grid); border-radius: 2px; padding: 2px 6px; }
.btn { background: var(--input); border: 1px solid var(--grid); border-radius: 2px; padding: 3px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }

/* 수식 줄 */
.fxbar { display: flex; border-bottom: 1px solid var(--grid); background: var(--bg); flex: none; }
.namebox { width: 90px; flex: none; padding: 4px 8px; border-right: 1px solid var(--grid); color: var(--head-ink); }
.fx { width: 32px; flex: none; text-align: center; padding: 4px 0; color: var(--muted); font-style: italic; border-right: 1px solid var(--grid); }
.fxval { flex: 1; padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* 격자 */
.sheet { flex: 1; overflow: auto; position: relative; min-height: 0; }
table.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.grid th, .grid td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 2px 6px; height: 22px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid thead th { position: sticky; background: var(--head); color: var(--head-ink); font-weight: 400; text-align: center; z-index: 2; }
.grid thead tr.letters th { top: 0; height: 20px; font-size: 12px; }
.grid thead tr.names th { top: 21px; text-align: left; color: var(--ink); font-weight: 600; cursor: pointer; }
.grid thead tr.names th:hover { background: #333; }
.grid th.rn { position: sticky; left: 0; z-index: 3; width: 46px; text-align: center; background: var(--head); color: var(--head-ink); font-weight: 400; }
.grid tbody th.rn { z-index: 1; cursor: pointer; }
.grid tbody td { background: var(--cell); cursor: cell; }
.grid tbody tr:nth-child(even) td { background: var(--cell-alt); }
.grid tbody tr.selrow td, .grid tbody tr.selrow th.rn { background: var(--sel-row); }
.grid tbody tr.selrow th.rn { color: var(--accent); }
.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
.grid td.cur { outline: 2px solid var(--accent); outline-offset: -2px; }
.grid td.visitor { color: var(--visitor); }
.grid td.dim { color: var(--muted); }
.grid .sort { color: var(--accent); font-size: 10px; margin-left: 4px; }
.empty { padding: 24px; color: var(--muted); }

/* 시트 탭 + 상태 줄 */
.tabs { display: flex; align-items: stretch; background: var(--bar); border-top: 1px solid var(--grid); flex: none; overflow-x: auto; }
.tabs button { background: transparent; border: 0; border-right: 1px solid var(--grid); padding: 5px 16px; cursor: pointer; color: var(--head-ink); white-space: nowrap; }
.tabs button.on { background: var(--bg); color: var(--accent); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.status { display: flex; gap: 18px; padding: 3px 12px; background: var(--title); color: #e8f5ee; font-size: 12px; flex: none; white-space: nowrap; overflow: hidden; }
.status .sp { flex: 1; }

/* 로그인 */
.login { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.login .box { background: var(--bar); border: 1px solid var(--grid); width: 100%; max-width: 420px; padding: 18px; }
.login h2 { margin: 0 0 4px; font-size: 15px; }
.login label { display: block; color: var(--muted); margin: 10px 0 3px; }
.login input { width: 100%; background: var(--input); border: 1px solid var(--grid); padding: 6px 8px; border-radius: 2px; }
.login .err { color: var(--warn); min-height: 1.4em; margin-top: 8px; white-space: pre-wrap; }
.login .btn { margin-top: 12px; width: 100%; padding: 7px; }
.hidden { display: none !important; }
@media (max-width: 640px) { .group { border-right: 0; padding-right: 0; } .namebox { width: 64px; } }
</style>
</head>
<body>
<div class="titlebar">
  <b>MMCA 관람 기록</b><span class="muted" id="book" style="opacity:.8"></span>
  <span class="sp"></span><span id="who"></span><button id="logout" class="hidden">로그아웃</button>
</div>

<div class="toolbar">
  <div class="group">
    <label for="from">기간</label><input id="from" type="date"><span>~</span><input id="to" type="date">
  </div>
  <div class="group">
    <label for="dev">기기</label>
    <select id="dev"><option value="">전체</option><option>1</option><option>2</option></select>
    <label><input id="showOff" type="checkbox"> 벗은 구간 포함</label>
  </div>
  <div class="group">
    <button class="btn go" id="load">불러오기</button>
    <button class="btn" id="clearSel" title="세션 선택을 풀고 기간 전체 보기">전체 세션</button>
  </div>
  <div class="group">
    <button class="btn" id="dlCsv">이 시트 CSV</button>
    <button class="btn" id="dlJson">원본 JSONL</button>
  </div>
</div>

<div class="fxbar">
  <div class="namebox" id="namebox">A1</div>
  <div class="fx">fx</div>
  <div class="fxval" id="fxval"></div>
</div>

<div class="sheet" id="sheet"></div>

<div class="tabs" id="tabs">
  <button data-sheet="sessions" class="on">세션</button>
  <button data-sheet="artworks">작품별 통계</button>
  <button data-sheet="visits">작품 관람</button>
  <button data-sheet="chat">대화</button>
  <button data-sheet="sensors">센서</button>
  <button data-sheet="log">전체 기록</button>
</div>
<div class="status"><span id="stState">준비</span><span id="stSel"></span><span class="sp"></span><span id="stCount"></span></div>

<div class="login hidden" id="login">
  <div class="box">
    <h2>로그인</h2>
    <div style="color:var(--muted)">프로젝트 ID와 키는 이 브라우저에만 저장됩니다.</div>
    <label for="ref">프로젝트 ID</label><input id="ref" autocomplete="off" placeholder="abcdefghijklmnopqrst">
    <label for="key">Publishable key</label><input id="key" autocomplete="off" placeholder="sb_publishable_…">
    <label for="email">이메일</label><input id="email" type="email" autocomplete="username">
    <label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn go" id="loginBtn">로그인</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const TABLE = 'research_events', PAGE = 1000, MAX_ROWS = 5000;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem('mmca.' + k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem('mmca.' + k, v); } catch {} },
};
let sb = null, rangeRows = [], sessions = [], selected = null, sessionRows = new Map();
let sheet = 'sessions', sortKey = null, sortDir = 1, view = { cols: [], rows: [] };

// ---------- 시작 ----------
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
$('to').value = iso(new Date());
$('from').value = iso(new Date(Date.now() - 6 * 86400000));
$('ref').value = store.get('ref'); $('key').value = store.get('key');
init();

async function init() {
  const ref = store.get('ref'), key = store.get('key');
  if (ref && key) {
    sb = supabase.createClient(`https://${ref}.supabase.co`, key);
    const { data } = await sb.auth.getSession();
    if (data.session) return signedIn(data.session.user);
  }
  $('login').classList.remove('hidden');
}
$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  const ref = $('ref').value.trim().replace(/^https?:\/\//, '').replace(/\.supabase\.co.*$/, '');
  const key = $('key').value.trim();
  if (!ref || !key) { $('loginErr').textContent = '프로젝트 ID와 키를 넣어 주세요.'; return; }
  store.set('ref', ref); store.set('key', key);
  sb = supabase.createClient(`https://${ref}.supabase.co`, key);
  const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  if (error) { $('loginErr').textContent = '로그인 실패: ' + error.message; return; }
  signedIn(data.user);
};
$('pw').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };
$('logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
function signedIn(user) {
  $('login').classList.add('hidden');
  $('logout').classList.remove('hidden');
  $('who').textContent = user.email;
  loadRange();
}

// ---------- 서버 ----------
async function fetchAll(build) {
  const out = [];
  for (let from = 0; ; from += PAGE) {
    const { data, error } = await build().range(from, from + PAGE - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < PAGE) break;
  }
  return out;
}
function rangeQuery(kinds) {
  const a = new Date($('from').value + 'T00:00:00'), b = new Date($('to').value + 'T00:00:00');
  b.setDate(b.getDate() + 1);
  let q = sb.from(TABLE).select('*').gte('at', a.toISOString()).lt('at', b.toISOString());
  if (kinds) q = q.in('kind', kinds);
  if ($('dev').value) q = q.eq('device', Number($('dev').value));
  return q.order('at').order('seq');
}
function status(text, err) { $('stState').textContent = text; $('stState').style.color = err ? '#ffd2bf' : ''; }

$('load').onclick = loadRange;
async function loadRange() {
  status('불러오는 중…');
  try { rangeRows = await fetchAll(() => rangeQuery(['session', 'log'])); }
  catch (e) { return status('불러오기 실패: ' + (e.message || e), true); }
  sessionRows.clear();
  buildSessions();
  if (selected && !sessions.some(s => s.id === selected)) selected = null;
  $('book').textContent = `· ${$('from').value} ~ ${$('to').value}`;
  status('준비');
  render();
}
async function rowsOfSession(id) {
  if (!sessionRows.has(id)) {
    status('세션 불러오는 중…');
    sessionRows.set(id, await fetchAll(() => sb.from(TABLE).select('*').eq('session_id', id).order('seq')));
    status('준비');
  }
  return sessionRows.get(id);
}

// ---------- 정리 ----------
function buildSessions() {
  const map = new Map();
  for (const r of rangeRows) {
    let s = map.get(r.session_id);
    if (!s) { s = { id: r.session_id, device: r.device, version: r.app_version, start: r.at, end: r.at, worn: false,
                    startReason: '', endReason: '', visits: [], chat: [], latencies: [], interrupts: 0,
                    explainStart: [], explainEnd: [], explainPause: [], visitorSec: 0, docentSec: 0, krw: 0, env: {} }; map.set(r.session_id, s); }
    if (r.at < s.start) s.start = r.at;
    if (r.at > s.end) s.end = r.at;
    if (r.kind === 'session' && r.category === 'start') { s.worn = !!(r.data && r.data.worn); s.startReason = r.message; s.env = r.data || {}; }
    const ev = r.data && r.data.event;
    if (ev === 'docent_start' && r.data.latency != null) s.latencies.push(r.data.latency);
    if (ev === 'visitor_start' && r.data.interrupted_docent) s.interrupts++;
    if (ev === 'visitor_end' && r.data.seconds) s.visitorSec += r.data.seconds;
    if (ev === 'docent_end' && r.data.seconds) s.docentSec += r.data.seconds;
    if (ev === 'explain_start') s.explainStart.push(r.data);
    if (ev === 'explain_end') s.explainEnd.push(r.data);
    if (ev === 'explain_pause') s.explainPause.push(r.data);
    if (r.category === 'usage' && r.data && r.data.krw != null) s.krw += r.data.krw;
    if (r.kind === 'session' && r.category === 'end') s.endReason = r.message;
    if (r.category === 'visit' && r.data) s.visits.push(visitOf(r));
    if (r.data && r.data.role) s.chat.push(r);
  }
  sessions = [...map.values()].sort((a, b) => a.start.localeCompare(b.start));
  sessions.forEach((s, i) => s.no = i + 1);
}
function visitOf(r) {
  const d = r.data;
  return { session: r.session_id, device: r.device, artwork: d.artwork, title: d.title || '', seconds: d.seconds,
           start: d.start ? new Date(d.start * 1000).toISOString() : r.at, end: d.end ? new Date(d.end * 1000).toISOString() : r.at, next: d.next };
}
const pad = n => String(n).padStart(2, '0');
const fmtDT = s => { const d = new Date(s); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const fmtT = s => { const d = new Date(s); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const secs = (a, b) => Math.round((new Date(b) - new Date(a)) / 1000);
const mmss = sec => sec == null || sec === '' ? '' : `${Math.floor(sec / 60)}:${pad(Math.round(sec % 60))}`;
const art = id => (id || '').replace('artwork_', '');
const sessLabel = id => { const s = sessions.find(x => x.id === id); return s ? `#${s.no}` : id.slice(0, 8); };
const visibleSessions = () => sessions.filter(s => s.worn || $('showOff').checked);
const scope = () => selected ? sessions.filter(s => s.id === selected) : visibleSessions();

function tickRow(t) {
  const d = t.data || {}, m = d.motion || {}, dec = d.decision || {};
  const ble = d.ble || [], cam = d.cam || [], g = m.gravity || [], b = m.magnetic || [];
  return { at: fmtT(t.at), current: art(d.current), decision: art(dec.id), certain: dec.certain == null ? '' : (dec.certain ? '확정' : '물어봄'),
    reason: dec.reason || '', ble1: art((ble[0] || [])[0]), ble1s: (ble[0] || [])[1] ?? '', ble2: art((ble[1] || [])[0]), ble2s: (ble[1] || [])[1] ?? '',
    cam1: art((cam[0] || [])[0]), cam1p: (cam[0] || [])[1] ?? '', cam2: art((cam[1] || [])[0]), cam2p: (cam[1] || [])[1] ?? '', camAge: d.camAge ?? '',
    walking: m.walking == null ? '' : (m.walking ? '걷는 중' : ''), walked: m.walked ?? '', heading: m.heading ?? '', yaw: m.yaw ?? '', accel: m.accel ?? '',
    gx: g[0] ?? '', gy: g[1] ?? '', gz: g[2] ?? '', mx: b[0] ?? '', my: b[1] ?? '', mz: b[2] ?? '',
    beacons: d.obs3 ? Object.entries(d.obs3).sort((x, y) => y[1][0] - x[1][0]).map(([k, v]) => `${k}:${v[0]}`).join(' ') : '' };
}

// ---------- 시트 ----------
const C = (key, label, w, opt = {}) => ({ key, label, w, ...opt });
const SHEETS = {
  sessions: () => ({
    cols: [C('no', '세션', 56, { num: 1 }), C('start', '시작', 150), C('end', '끝', 150), C('len', '길이', 64, { num: 1 }),
      C('device', '기기', 46, { num: 1 }), C('worn', '상태', 56), C('nVisits', '작품 수', 64, { num: 1 }), C('path', '작품 경로', 260),
      C('visitSec', '작품 앞 합계', 90, { num: 1 }), C('nVisitor', '관람객 말', 72, { num: 1 }), C('nDocent', '도슨트 말', 72, { num: 1 }),
      C('latency', '응답 지연 평균 초', 110, { num: 1 }), C('interrupts', '끼어들기', 64, { num: 1 }),
      C('visitorSec', '관람객 말한 초', 96, { num: 1 }), C('docentSec', '도슨트 말한 초', 96, { num: 1 }),
      C('nExplain', '설명 시작', 64, { num: 1 }), C('nExplainDone', '설명 끝까지', 76, { num: 1 }), C('krw', 'AI 비용 원', 72, { num: 1 }),
      C('lang', '언어', 46), C('engine', '엔진', 70), C('startReason', '시작 이유', 90), C('endReason', '끝난 이유', 110), C('version', '앱', 64), C('id', '세션 ID', 280, { dim: 1 })],
    rows: visibleSessions().map(s => ({ _sid: s.id, no: s.no, start: fmtDT(s.start), end: fmtDT(s.end), len: mmss(secs(s.start, s.end)),
      device: s.device, worn: s.worn ? '관람' : '벗음', nVisits: s.visits.length,
      path: s.visits.map(v => art(v.artwork) + (v.next === '이동' ? ' →(이동)' : '')).join(' → '),
      visitSec: mmss(s.visits.reduce((a, v) => a + (v.seconds || 0), 0)),
      nVisitor: s.chat.filter(c => c.data.role === 'visitor').length, nDocent: s.chat.filter(c => c.data.role !== 'visitor').length,
      latency: s.latencies.length ? +(s.latencies.reduce((a, b) => a + b, 0) / s.latencies.length).toFixed(2) : '',
      interrupts: s.interrupts, visitorSec: Math.round(s.visitorSec), docentSec: Math.round(s.docentSec),
      nExplain: s.explainStart.length, nExplainDone: s.explainEnd.length, krw: s.krw,
      lang: s.env.language || '', engine: (s.env.settings || {}).voice_engine || '',
      startReason: s.startReason, endReason: s.endReason, version: s.version, id: s.id })),
  }),
  visits: () => ({
    cols: [C('session', '세션', 56), C('device', '기기', 46, { num: 1 }), C('order', '순서', 46, { num: 1 }), C('start', '도착', 150), C('end', '떠남', 76),
      C('artwork', '작품', 50), C('title', '제목', 240), C('seconds', '머문 초', 70, { num: 1 }), C('mmss', '머문 시간', 70, { num: 1 }), C('next', '다음', 120)],
    rows: scope().flatMap(s => s.visits.map((v, i) => ({ _sid: s.id, session: '#' + s.no, device: v.device, order: i + 1, start: fmtDT(v.start), end: fmtT(v.end),
      artwork: art(v.artwork), title: v.title, seconds: v.seconds, mmss: mmss(v.seconds), next: String(v.next || '').startsWith('artwork_') ? art(v.next) : v.next }))),
  }),
  artworks: () => {
    // 작품마다: 관람 횟수, 본 세션(관람객) 수, 머문 시간 합·평균·최대, 그 작품 앞에서 한 관람객 말 수 → 선호 순위
    const m = new Map();
    const get = (id, title) => { let a = m.get(id); if (!a) { a = { id, title: '', visits: 0, sessions: new Set(), total: 0, max: 0, questions: 0, ex: 0, exDone: 0, exPart: [] }; m.set(id, a); } if (title) a.title = title; return a; };
    const ss = scope();
    for (const s of ss) {
      for (const v of s.visits) { const a = get(v.artwork, v.title); a.visits++; a.sessions.add(s.id); a.total += v.seconds || 0; a.max = Math.max(a.max, v.seconds || 0); }
      for (const c of s.chat) if (c.data.role === 'visitor' && c.data.artwork) get(c.data.artwork).questions++;
      for (const e of s.explainStart) get(e.artwork, e.title).ex++;
      for (const e of s.explainEnd) get(e.artwork).exDone++;
      for (const e of s.explainPause) { const f = e.duration ? e.position / e.duration : (e.script_chars ? e.chars_spoken / e.script_chars : null); if (f != null) get(e.artwork).exPart.push(f); }
    }
    const n = ss.length || 1;
    const rows = [...m.values()].filter(a => a.id).sort((a, b) => b.total - a.total).map((a, i) => ({
      _sid: null, rank: i + 1, artwork: art(a.id), title: a.title, visits: a.visits, sessions: a.sessions.size,
      reach: Math.round(a.sessions.size / n * 100), total: mmss(a.total), totalSec: Math.round(a.total),
      avg: a.visits ? Math.round(a.total / a.visits) : 0, max: Math.round(a.max), questions: a.questions,
      ex: a.ex, exDone: a.exDone, exRate: a.ex ? Math.round(a.exDone / a.ex * 100) : '',
      exPart: a.exPart.length ? Math.round(a.exPart.reduce((x, y) => x + y, 0) / a.exPart.length * 100) : '' }));
    return {
      cols: [C('rank', '순위', 46, { num: 1 }), C('artwork', '작품', 50), C('title', '제목', 240), C('totalSec', '머문 초 합계', 90, { num: 1 }),
        C('total', '머문 시간 합계', 100, { num: 1 }), C('avg', '평균 초', 64, { num: 1 }), C('max', '최대 초', 64, { num: 1 }),
        C('visits', '관람 횟수', 70, { num: 1 }), C('sessions', '본 세션 수', 76, { num: 1 }), C('reach', '본 비율 %', 72, { num: 1 }),
        C('questions', '관람객 말 수', 86, { num: 1 }), C('ex', '설명 시작', 64, { num: 1 }), C('exDone', '끝까지 들음', 76, { num: 1 }),
        C('exRate', '끝까지 %', 64, { num: 1 }), C('exPart', '멈출 때 들은 %', 96, { num: 1 })],
      rows,
    };
  },
  chat: () => ({
    cols: [C('session', '세션', 56), C('at', '시각', 150), C('artwork', '작품', 50), C('who', '누가', 64), C('via', '방법', 56), C('text', '내용', 720)],
    rows: scope().flatMap(s => s.chat.map(c => ({ _sid: s.id, _visitor: c.data.role === 'visitor', session: '#' + s.no, at: fmtDT(c.at), artwork: art(c.data.artwork),
      who: c.data.role === 'visitor' ? '관람객' : '도슨트', via: c.data.role === 'visitor' ? (c.data.via === 'phone' ? '휴대폰' : '음성') : '', text: c.data.text }))),
  }),
  sensors: async () => {
    const cols = [C('at', '시각', 70), C('current', '지금 작품', 64), C('decision', '판정', 46), C('certain', '확신', 56), C('reason', '근거', 160),
      C('ble1', 'BLE 1위', 58), C('ble1s', '점수', 54, { num: 1 }), C('ble2', 'BLE 2위', 58), C('ble2s', '점수', 54, { num: 1 }),
      C('cam1', '사진 1위', 58), C('cam1p', '확률', 54, { num: 1 }), C('cam2', '사진 2위', 58), C('cam2p', '확률', 54, { num: 1 }), C('camAge', '사진 나이', 64, { num: 1 }),
      C('walking', '걷기', 56), C('walked', '걸은 m', 58, { num: 1 }), C('heading', '방향°', 56, { num: 1 }), C('yaw', 'yaw°', 56, { num: 1 }), C('accel', '가속', 56, { num: 1 }),
      C('gx', '중력x', 54, { num: 1 }), C('gy', '중력y', 54, { num: 1 }), C('gz', '중력z', 54, { num: 1 }),
      C('mx', '자기x', 54, { num: 1 }), C('my', '자기y', 54, { num: 1 }), C('mz', '자기z', 54, { num: 1 }), C('beacons', '비콘 3초 평균 rssi', 600, { dim: 1 })];
    if (!selected) return { cols, rows: [], note: '센서 시트는 세션 하나를 고르면 보입니다. "세션" 시트에서 행을 누르세요.' };
    const rows = (await rowsOfSession(selected)).filter(r => r.kind === 'tick').map(t => ({ _sid: selected, ...tickRow(t) }));
    return { cols, rows };
  },
  log: async () => {
    const src = selected ? (await rowsOfSession(selected)).filter(r => r.kind !== 'tick')
                         : rangeRows.filter(r => scope().some(s => s.id === r.session_id));
    return {
      cols: [C('session', '세션', 56), C('at', '시각', 150), C('level', '종류', 56), C('category', '분류', 90), C('artwork', '작품', 50), C('message', '내용', 720)],
      rows: src.map(r => ({ _sid: r.session_id, session: sessLabel(r.session_id), at: fmtDT(r.at), level: r.level, category: r.category, artwork: art(r.artwork_id), message: r.message })),
    };
  },
};

async function render() {
  const v = await SHEETS[sheet]();
  view = v;
  let rows = v.rows.slice();
  if (sortKey && v.cols.some(c => c.key === sortKey)) {
    rows.sort((a, b) => { const x = a[sortKey], y = b[sortKey];
      const nx = parseFloat(x), ny = parseFloat(y);
      return (isNaN(nx) || isNaN(ny) ? String(x ?? '').localeCompare(String(y ?? '')) : nx - ny) * sortDir; });
  }
  view.sorted = rows;
  const letters = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const shown = rows.slice(0, MAX_ROWS);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const width = 46 + v.cols.reduce((a, c) => a + c.w, 0);
  let html = `<table class="grid" style="width:${width}px"><colgroup><col style="width:46px">${v.cols.map(c => `<col style="width:${c.w}px">`).join('')}</colgroup>
    <thead><tr class="letters"><th class="rn"></th>${v.cols.map((c, i) => `<th>${letters(i)}</th>`).join('')}</tr>
    <tr class="names"><th class="rn">1</th>${v.cols.map(c => `<th data-key="${c.key}">${esc(c.label)}${sortKey === c.key ? `<span class="sort">${sortDir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('')}</tr></thead><tbody>`;
  shown.forEach((r, i) => {
    html += `<tr data-i="${i}" class="${sheet === 'sessions' && r._sid === selected ? 'selrow' : ''}"><th class="rn">${i + 2}</th>` +
      v.cols.map(c => `<td class="${c.num ? 'num' : ''}${c.dim ? ' dim' : ''}${c.key === 'text' && r._visitor ? ' visitor' : ''}" title="${esc(r[c.key])}">${esc(r[c.key])}</td>`).join('') + '</tr>';
  });
  html += '</tbody></table>';
  if (v.note) html += `<div class="empty">${esc(v.note)}</div>`;
  else if (!rows.length) html += `<div class="empty">${sessions.length ? '이 시트에 보일 기록이 없습니다.' : '이 기간에 기록이 없습니다. 기간을 바꾸고 불러오기를 누르세요.'}</div>`;
  $('sheet').innerHTML = html;
  $('stCount').textContent = `행 ${rows.length.toLocaleString()}개` + (rows.length > MAX_ROWS ? ` (처음 ${MAX_ROWS.toLocaleString()}개 표시, 전부는 CSV)` : '');
  const s = sessions.find(x => x.id === selected);
  $('stSel').textContent = s ? `선택: 세션 #${s.no} · 기기 ${s.device ?? '-'} · ${fmtDT(s.start)}` : `세션 ${visibleSessions().length}개 전체`;
  $('namebox').textContent = 'A1'; $('fxval').textContent = '';
}

// 칸 누르기 → 수식 줄, 세션 시트에선 행 = 세션 선택
$('sheet').addEventListener('click', e => {
  const th = e.target.closest('thead tr.names th[data-key]');
  if (th) { const k = th.dataset.key; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; return render(); }
  const td = e.target.closest('tbody td'), tr = e.target.closest('tbody tr');
  if (!tr) return;
  const row = view.sorted[Number(tr.dataset.i)];
  document.querySelectorAll('.grid td.cur').forEach(x => x.classList.remove('cur'));
  if (td) {
    td.classList.add('cur');
    const ci = [...tr.children].indexOf(td) - 1, col = view.cols[ci];
    $('namebox').textContent = String.fromCharCode(65 + (ci % 26)) + (Number(tr.dataset.i) + 2);
    $('fxval').textContent = String(row[col.key] ?? '');
  }
  if (sheet === 'sessions' && row && row._sid !== selected) {
    selected = row._sid;
    document.querySelectorAll('.grid tbody tr').forEach(x => x.classList.toggle('selrow', x === tr));
    const s = sessions.find(x => x.id === selected);
    $('stSel').textContent = `선택: 세션 #${s.no} · 기기 ${s.device ?? '-'} · ${fmtDT(s.start)}`;
  }
});
$('sheet').addEventListener('dblclick', e => {
  if (sheet === 'sessions' && e.target.closest('tbody tr')) switchSheet('visits');
});
for (const b of $('tabs').querySelectorAll('button')) b.onclick = () => switchSheet(b.dataset.sheet);
function switchSheet(name) {
  sheet = name; sortKey = null;
  for (const o of $('tabs').querySelectorAll('button')) o.classList.toggle('on', o.dataset.sheet === name);
  render().catch(e => status('불러오기 실패: ' + (e.message || e), true));
}
$('clearSel').onclick = () => { selected = null; render(); };
$('showOff').onchange = () => render();

// ---------- 내려받기 ----------
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const SHEET_NAMES = { artworks: '작품별통계', sessions: '세션', visits: '작품관람', chat: '대화', sensors: '센서', log: '전체기록' };
$('dlCsv').onclick = () => {
  const cell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = view.sorted || [];
  const text = '﻿' + [view.cols.map(c => cell(c.label)).join(','), ...rows.map(r => view.cols.map(c => cell(r[c.key])).join(','))].join('\r\n');
  const s = sessions.find(x => x.id === selected);
  download(`mmca_${SHEET_NAMES[sheet]}_${s ? '세션' + s.no : $('from').value + '_' + $('to').value}.csv`, text, 'text/csv');
};
$('dlJson').onclick = async () => {
  try {
    let all;
    if (selected) all = await rowsOfSession(selected);
    else { status('센서 기록까지 모두 받는 중…'); all = await fetchAll(() => rangeQuery(null)); status('준비'); }
    const s = sessions.find(x => x.id === selected);
    download(`mmca_원본_${s ? '세션' + s.no : $('from').value + '_' + $('to').value}.jsonl`, all.map(r => JSON.stringify(r)).join('\n'), 'application/x-ndjson');
  } catch (e) { status('받기 실패: ' + (e.message || e), true); }
};
</script>
